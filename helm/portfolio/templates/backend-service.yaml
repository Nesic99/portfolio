apiVersion: v1
kind: Service
metadata:
  name: {{ include "portfolio.fullname" . }}-backend
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
    {{- include "portfolio.backend.selectorLabels" . | nindent 4 }}
spec:
  # ClusterIP — backend is internal only, Nginx proxies to it
  type: ClusterIP
  selector:
    {{- include "portfolio.backend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
